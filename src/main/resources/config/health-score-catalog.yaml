# Kod sağlığı motoru. Karmaşıklık ve kalite ayrıdır; tek skora indirgenmez.
# Ham kural skoru yüksek = temiz. Rapordaki karmaşıklık = 100 - ham. Kalite = ham.
# Ağırlıklar öncelik varsayılanıdır (kritik 10, yüksek 6, orta 3, düşük 1); weight ile ezilir.
# Ölçüm tavanı (bu değerde kural skoru 0) Apache Commons Lang src/main/java ile kalibre edildi:
# 264 dosya, 3520 metot, 2026-11-09. CC 17, cognitive 21, satır 36 aynı koşunun p99'u.
# p90 (5 / 5 / 10 / 4) ruleset'in ihlal çizgisinin altında kalıyordu; skor sıfır, ihlal henüz yok olurdu.
# NPath skor tavanı 200. Sayılan metotların p99'u 16 idi; en yüksek sayılan yol 257.
# 16, dört bağımsız if'te doluyordu. 200, sayılan aralığı ayırır.
# Sayım, yürüyen yol sayısı 200'e varınca durur ve 200 yazılır. 200 ve üstü bu kuralda 0 puandır;
# tavanın altındaki sayı PMD ile aynıdır. Dallanma 15 ve üstü hiç sayılmaz, 2e9 yazılır, o da 0 puandır.

version: health-v1
priority_weights:
  critical: 10
  high: 6
  medium: 3
  low: 1
aggregation:
  w1: 50
  w2: 50
  drill_worst_classes: 3
  drill_worst_methods: 5
bands:
  quality:
    cok_iyi: 90
    iyi: 75
    orta: 50
    zayif: 25
  complexity_reported:
    cok_iyi_max: 24
    iyi_max: 49
    orta_max: 74
    zayif_max: 89

rules:
  # --- Karmaşıklık: sayısal metrik (PMD kuralı ayrıca ihlal yazsa da skor metrikten) ---
  - id: CyclomaticComplexity
    concept: branching
    axis: complexity
    scope: method
    priority: critical
    kind: metric
    signal: cyclomaticComplexity
    metric_max: 17
    aliases: [CyclomaticComplexMethod, cyclomatic_complexity]
  - id: CognitiveComplexity
    concept: cognitive
    axis: complexity
    scope: method
    priority: critical
    kind: metric
    signal: cognitiveComplexity
    metric_max: 21
  - id: NPathComplexity
    concept: npath
    axis: complexity
    scope: method
    priority: critical
    kind: metric
    signal: npathComplexity
    metric_max: 200
  - id: NcssCount
    concept: length
    axis: complexity
    scope: method
    priority: critical
    kind: metric
    signal: ncssCount
    metric_max: 36
    aliases: [LongMethod, function_body_length]
  - id: ExcessiveParameterList
    concept: parameters
    axis: complexity
    scope: method
    priority: high
    kind: metric
    signal: parameterCount
    metric_max: 7
    aliases: [LongParameterList, function_parameter_count]
  - id: AvoidDeeplyNestedIfStmts
    concept: nesting
    axis: complexity
    scope: method
    priority: high
    kind: metric
    signal: maxNestingDepth
    metric_max: 5
    aliases: [NestedBlockDepth, nesting]

  # --- Karmaşıklık: sınıf ihlali ---
  - id: GodClass
    concept: god_class
    axis: complexity
    scope: class
    priority: critical
    kind: violation
    aliases: [LargeClass, type_body_length]
  - id: ExcessivePublicCount
    concept: public_surface
    axis: complexity
    scope: class
    priority: high
    kind: violation
  - id: ExcessiveImports
    concept: imports
    axis: complexity
    scope: class
    priority: high
    kind: violation
  - id: TooManyMethods
    concept: too_many_methods
    axis: complexity
    scope: class
    priority: high
    kind: violation
    aliases: [TooManyFunctions]
  - id: TooManyFields
    concept: too_many_fields
    axis: complexity
    scope: class
    priority: high
    kind: violation
  - id: CouplingBetweenObjects
    concept: coupling
    axis: complexity
    scope: class
    priority: high
    kind: violation
  - id: SwitchDensity
    concept: switch_density
    axis: complexity
    scope: method
    priority: high
    kind: violation
  - id: LawOfDemeter
    concept: demeter
    axis: complexity
    scope: method
    priority: medium
    kind: violation
  - id: LoosePackageCoupling
    concept: package_coupling
    axis: complexity
    scope: class
    priority: medium
    kind: violation
  - id: DataClass
    concept: data_class
    axis: complexity
    scope: class
    priority: medium
    kind: violation
    skip_on_record: true
  - id: CollapsibleIfStatements
    concept: collapsible_if
    axis: complexity
    scope: method
    priority: medium
    kind: violation
  - id: SingularField
    concept: singular_field
    axis: complexity
    scope: class
    priority: medium
    kind: violation
  - id: ForLoopVariableCount
    concept: for_loop_variables
    axis: complexity
    scope: method
    priority: medium
    kind: violation
  - id: SimplifyBooleanExpressions
    concept: boolean_noise
    axis: complexity
    scope: method
    priority: low
    kind: violation
  - id: SimplifyBooleanReturns
    concept: boolean_return
    axis: complexity
    scope: method
    priority: low
    kind: violation
  - id: SimplifyConditional
    concept: simplify_conditional
    axis: complexity
    scope: method
    priority: low
    kind: violation
  - id: SimplifiedTernary
    concept: simplified_ternary
    axis: complexity
    scope: method
    priority: low
    kind: violation
  - id: LogicInversion
    concept: logic_inversion
    axis: complexity
    scope: method
    priority: low
    kind: violation

  # --- Kalite ---
  - id: CompareObjectsWithEquals
    concept: reference_equals
    axis: quality
    scope: method
    priority: critical
    kind: violation
  - id: OverrideBothEqualsAndHashcode
    concept: equals_hashcode
    axis: quality
    scope: class
    priority: critical
    kind: violation
    aliases: [EqualsWithHashCodeExist]
  - id: ConstructorCallsOverridableMethod
    concept: constructor_override
    axis: quality
    scope: method
    priority: critical
    kind: violation
  - id: NullAssignment
    concept: null_assignment
    axis: quality
    scope: method
    priority: critical
    kind: violation
    aliases: [UnsafeCallOnNullableType, force_unwrapping]
  - id: CloseResource
    concept: resource_leak
    axis: quality
    scope: method
    priority: critical
    kind: violation
  - id: EmptyCatchBlock
    concept: swallowed_exception
    axis: quality
    scope: method
    priority: critical
    kind: violation
    aliases: [SwallowedException]
  - id: AvoidCatchingGenericException
