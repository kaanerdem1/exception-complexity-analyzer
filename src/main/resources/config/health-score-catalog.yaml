    priority: critical
    kind: violation
  - id: InsecureCryptoIv
    concept: insecure_iv
    axis: quality
    scope: method
    priority: critical
    kind: violation
  - id: AvoidUsingHardCodedIP
    concept: hardcoded_ip
    axis: quality
    scope: method
    priority: critical
    kind: violation
  - id: DoubleCheckedLocking
    concept: double_checked_locking
    axis: quality
    scope: class
    priority: critical
    kind: violation
  - id: NonThreadSafeSingleton
    concept: unsafe_singleton
    axis: quality
    scope: class
    priority: critical
    kind: violation
  - id: UseConcurrentHashMap
    concept: concurrent_map
    axis: quality
    scope: method
    priority: critical
    kind: violation
  - id: CheckResultSet
    concept: unchecked_resultset
    axis: quality
    scope: method
    priority: high
    kind: violation
  - id: ExhaustiveSwitchHasDefault
    concept: switch_default
    axis: quality
    scope: method
    priority: high
    kind: violation
    # Sealed tipte derleyici zaten eksik case'i yakalar. O ihlal skorda düşük ağırlığa iner. Enum yüksek kalır.
