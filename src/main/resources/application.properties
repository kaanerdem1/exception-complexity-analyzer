# Sunucu modu (java -jar system-code-analyzer-1.0.0.jar --server) ayarlari.
# Hepsi ortam degiskeniyle de verilebilir: PORT, SCANNER_CONFIG, SCANNER_WORK_DIR,
# SCANNER_OUTPUT_DIR, SCANNER_API_KEY, SCANNER_SCHEDULE_CRON, SCANNER_SCHEDULE_ZONE
server.port=${PORT:8080}
server.shutdown=graceful
# Ters proxy / Route X-Forwarded-* basliklari: Swagger'daki adres https ve dogru host olsun
server.forward-headers-strategy=framework
spring.main.banner-mode=off
# PMD, auxClasspath bosken calisan JDK'nin jrt-fs.jar'ini ekleyip uyarir (Java 17+17 zararsiz)
logging.level.net.sourceforge.pmd.lang.java.internal.JavaLanguageProcessor=ERROR
# Istekteki yanlis yazilmis alan adlari sessizce yok sayilmasin
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

scanner.config=${SCANNER_CONFIG:scanner.properties}
scanner.work-dir=${SCANNER_WORK_DIR:./scannedRepos}
scanner.output-dir=${SCANNER_OUTPUT_DIR:./scanReports}
scanner.api-key=${SCANNER_API_KEY:}
# Gunluk otomatik tarama (scanner.properties ile). Spring cron: saniye dakika saat gun ay haftanin-gunu
# Varsayilan: her gun 12:30. Kapatmak icin "-"
scanner.schedule-cron=${SCANNER_SCHEDULE_CRON:0 30 12 * * *}
scanner.schedule-zone=${SCANNER_SCHEDULE_ZONE:Europe/Istanbul}

# Konteyner saglik kontrolleri: /actuator/health/liveness ve /actuator/health/readiness
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.diskspace.enabled=true

# Swagger arayuzu: /swagger-ui.html, OpenAPI dokumani: /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.paths-to-match=/api/**
